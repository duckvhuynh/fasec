[package]
name = "fasec-vision"
description = "Model runtime and vision pipeline: detect, track, recognize, liveness, attention."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fasec-config = { version = "0.0.1", path = "../fasec-config" }
fasec-core = { version = "0.0.1", path = "../fasec-core" }
image = { version = "0.25.9", default-features = false }
ndarray = "0.17"
ort = "=2.0.0-rc.15"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
fasec-models = { path = "../fasec-models" }

[target."cfg(windows)".dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
