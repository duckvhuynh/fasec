[package]
name = "fasec-identity"
description = "Enrolment flows, face gallery and encrypted template store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes the INSECURE `protect::testing::XorProtector` to other crates' tests.
testing = []

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
