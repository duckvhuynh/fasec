[package]
name = "fasec-ui"
description = "Settings window, first-run wizard, live preview and diagnostics (egui)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
anyhow = "1.0.104"
eframe = "0.35.0"
fasec-camera = { version = "0.0.1", path = "../fasec-camera" }
fasec-config = { version = "0.0.1", path = "../fasec-config" }
fasec-core = { version = "0.0.1", path = "../fasec-core" }
fasec-identity = { version = "0.0.1", path = "../fasec-identity" }
fasec-platform = { version = "0.0.1", path = "../fasec-platform", features = ["identity"] }
fasec-replay = { version = "0.0.1", path = "../fasec-replay" }
fasec-vision = { version = "0.0.1", path = "../fasec-vision" }
zeroize = "1.9.2"

# Run the examples' unit tests (reject messages, CLI parsing, gallery commit, labels) in `cargo test`.
[[example]]
name = "enroll"
test = true

[[example]]
name = "live_debug"
test = true

[[example]]
name = "ir_debug"
test = true
