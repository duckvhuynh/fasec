[package]
name = "fasec-platform"
description = "Win32/WinRT wrappers: hotkeys, session events, Windows Hello, DPAPI, power."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fasec-identity = { version = "0.0.1", path = "../fasec-identity", optional = true }
thiserror = "2.0.21"
zeroize = "1.9.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[features]
# `impl fasec_identity::SecretProtector for Dpapi`.
identity = ["dep:fasec-identity"]
