[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # mozjpeg (via nokhwa, fasec-camera): Independent JPEG Group licence, permissive.
  "IJG",
  # webpki-roots / webpki-root-certs (via ureq): Mozilla CA bundle data.
  "CDLA-Permissive-2.0",
]
# Our own workspace crates are not published.
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
