# MiniFASNet: upstream ships PyTorch weights only (Apache-2.0). No download URL: produce the ONNX
# files locally with `python tools/export_minifasnet.py` (writes models/), which converts
# 2.7_80x80_MiniFASNetV2.pth and 4_0_0_80x80_MiniFASNetV1SE.pth from upstream commit
# b6d5f04ad78778917853b25c778acef6d5626d15 (weights SHA-256 checked by the script).
# The hashes below are of that export made with the pinned tools/requirements-export.txt
# (Python 3.12.10, torch 2.15.0+cpu, onnx 1.23.2, onnxscript 0.7.2, onnxruntime 1.32.0, opset 17).
# Input `input` [1,3,80,80] BGR 0..255, output `output` [1,3] logits.
[[model]]
id = "minifasnet-v2"
task = "liveness"
url = ""
sha256 = "ce6a0bc1d8044a64484d160c95a6660dea494add134335d1389bbd165a364ea3"
file = "minifasnet_v2.onnx"
size = 1743535
license = "Apache-2.0"
source = "https://github.com/minivision-ai/Silent-Face-Anti-Spoofing"
default = true

[[model]]
id = "minifasnet-v1se"
task = "liveness"
url = ""
sha256 = "93ae9c0f0df1c71397e8cb3648c16082ba8b8bd0a255e6b8e84b664f01d6bd12"
file = "minifasnet_v1se.onnx"
size = 1742703
