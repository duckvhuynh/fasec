# Model manifest (SRS §6.3). Weights are downloaded at runtime and verified by SHA-256.
# Never commit weights. An entry with an empty `sha256` MUST NOT be loaded; one with an empty
# `url` is never downloaded and is loaded only from a manually produced `file` that verifies.
# URLs are pinned to a commit so the hash cannot drift.

[[model]]
id = "yunet-2023mar"
task = "face_detection"
url = "https://huggingface.co/opencv/face_detection_yunet/resolve/3cc26e7f1014a5ee5d74a42acee58bafc9d0a310/face_detection_yunet_2023mar.onnx"
sha256 = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
size = 232589
license = "MIT"
source = "https://github.com/opencv/opencv_zoo/tree/main/models/face_detection_yunet"
default = true

[[model]]
id = "sface-2021dec"
task = "face_recognition"
url = "https://huggingface.co/opencv/face_recognition_sface/resolve/3d7082438a6e4551e840c9b2bb60b71e8da4b524/face_recognition_sface_2021dec.onnx"
sha256 = "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
size = 38696353
license = "Apache-2.0"
