name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Tests that need model weights, `.assets/` images or a camera are `#[ignore]`d and not run here.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --examples

  # rust-version in Cargo.toml (MSRV) must keep building.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # Platform-neutral crates must build and pass on Linux (NFR-MNT-001).
  linux-neutral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ort-sys (download-binaries, tls-native) pulls native-tls -> openssl-sys on Linux.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo test
          -p fasec-core -p fasec-config -p fasec-vision -p fasec-identity
          -p fasec-policy -p fasec-models -p fasec-replay

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
